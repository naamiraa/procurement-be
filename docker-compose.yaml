version: "3.9"

services:
  procurement-db:
    image: postgres:17.5-alpine
    ports:
      - "35001:5432"
    restart: "no"
    environment:
      POSTGRES_USER: bp-dev
      POSTGRES_PASSWORD: procbp
      POSTGRES_DB: bp-dev
    volumes:
      - procurement-db:/var/lib/postgresql/data

volumes:
  procurement-db:
    driver: local
